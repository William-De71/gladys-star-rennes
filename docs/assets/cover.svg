<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the STAR Rennes integration for Gladys Assistant (illustration,
       not the logo of STAR). A driverless metro train of Rennes on its
       viaduct in the morning, a bus below, and a screen of the stops
       announcing the next passages. Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb6e0"/>
      <stop offset="0.65" stop-color="#cfe4f2"/>
      <stop offset="1" stop-color="#f4e6cf"/>
    </linearGradient>
    <linearGradient id="train" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f6f8"/>
      <stop offset="1" stop-color="#c9ced6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4e66"/>
      <stop offset="1" stop-color="#1d2a3a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>

  <!-- the roofs and towers of Rennes -->
  <path d="M0 330 L0 260 L40 260 L40 230 L70 230 L70 262 L110 262 L110 214 L126 196 L142 214 L142 262 L190 262 L190 240 L230 240 L230 205 L262 205 L262 262 L300 262 L300 226 L322 210 L344 226 L344 262 L400 262 L400 236 L440 236 L440 190 L470 190 L470 262 L520 262 L520 228 L556 228 L556 262 L610 262 L610 208 L628 178 L646 208 L646 262 L700 262 L700 238 L746 238 L746 262 L800 262 L800 330 Z" fill="#a9bccd"/>
  <rect x="0" y="330" width="800" height="204" fill="#8b9aa8"/>

  <!-- the viaduct of line b -->
  <rect x="0" y="292" width="800" height="18" fill="#e7e9ec"/>
  <rect x="0" y="310" width="800" height="6" fill="#c3c8cf"/>
  <g fill="#d5d9de">
    <rect x="70" y="316" width="26" height="110"/>
    <rect x="300" y="316" width="26" height="110"/>
    <rect x="530" y="316" width="26" height="110"/>
    <rect x="760" y="316" width="26" height="110"/>
  </g>

  <!-- the metro train: two cars, rounded front, a red stripe -->
  <g transform="translate(60 214)">
    <rect x="0" y="0" width="520" height="78" rx="16" fill="url(#train)"/>
    <path d="M520 8 Q 572 14 576 50 L576 78 L520 78 Z" fill="url(#train)"/>
    <rect x="0" y="54" width="576" height="8" fill="#e1251b"/>
    <g fill="url(#glass)">
      <rect x="22" y="14" width="70" height="30" rx="5"/>
      <rect x="104" y="14" width="70" height="30" rx="5"/>
      <rect x="186" y="14" width="56" height="30" rx="5"/>
      <rect x="276" y="14" width="56" height="30" rx="5"/>
      <rect x="344" y="14" width="70" height="30" rx="5"/>
      <rect x="426" y="14" width="70" height="30" rx="5"/>
      <path d="M528 16 Q 560 20 566 46 L528 46 Z"/>
    </g>
    <rect x="257" y="0" width="6" height="78" fill="#9aa3ad"/>
  </g>

  <!-- the bus on the street -->
  <g transform="translate(470 392)">
    <rect x="0" y="0" width="250" height="70" rx="12" fill="#2b2f36"/>
    <rect x="0" y="48" width="250" height="10" fill="#e1251b"/>
    <g fill="#8fb3d1">
      <rect x="14" y="10" width="46" height="28" rx="4"/>
      <rect x="70" y="10" width="46" height="28" rx="4"/>
      <rect x="126" y="10" width="46" height="28" rx="4"/>
      <rect x="182" y="10" width="54" height="28" rx="4"/>
    </g>
    <circle cx="50" cy="72" r="15" fill="#15181d"/>
    <circle cx="200" cy="72" r="15" fill="#15181d"/>
    <circle cx="50" cy="72" r="6" fill="#6b7480"/>
    <circle cx="200" cy="72" r="6" fill="#6b7480"/>
  </g>

  <!-- the screen of the stop -->
  <g transform="translate(40 352)">
    <rect x="0" y="0" width="380" height="150" rx="14" fill="url(#screen)"/>
    <rect x="0" y="0" width="380" height="150" rx="14" fill="none" stroke="#3a4352" stroke-width="3"/>
    <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold">
      <rect x="20" y="20" width="34" height="26" rx="5" fill="#e1251b"/>
      <text x="37" y="40" font-size="18" fill="#ffffff" text-anchor="middle">a</text>
      <text x="68" y="40" font-size="20" fill="#e8eef6">La Poterie</text>
      <text x="360" y="40" font-size="22" fill="#ffd166" text-anchor="end">2 min</text>
      <rect x="20" y="62" width="34" height="26" rx="5" fill="#f28c28"/>
      <text x="37" y="82" font-size="16" fill="#ffffff" text-anchor="middle">C1</text>
      <text x="68" y="82" font-size="20" fill="#e8eef6">Chantepie</text>
      <text x="360" y="82" font-size="22" fill="#ffd166" text-anchor="end">6 min</text>
      <rect x="20" y="104" width="34" height="26" rx="5" fill="#2e86c1"/>
      <text x="37" y="124" font-size="16" fill="#ffffff" text-anchor="middle">11</text>
      <text x="68" y="124" font-size="20" fill="#e8eef6">ZI Ouest</text>
      <text x="360" y="124" font-size="22" fill="#ffd166" text-anchor="end">9 min</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="40" y="92" font-size="58" font-weight="bold" fill="#13263d">STAR Rennes</text>
    <text x="42" y="136" font-size="26" fill="#22384f">Bus &amp; métro · temps réel · trafic</text>
    <text x="42" y="172" font-size="22" fill="#2f4a66">pour Gladys Assistant</text>
  </g>
</svg>
